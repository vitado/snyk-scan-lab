name: Snyk scan

# Dynamic title so the Actions run list shows WHAT was scanned, not just "Snyk scan".
# e.g. "Snyk · sca · vitado/ai-dial-core@development · low" or "Snyk · container · alpine:3.19 · high".
run-name: >-
  Snyk · ${{ inputs.type }} · ${{ inputs.target }}${{ inputs.ref != '' && format('@{0}', inputs.ref) || '' }} · ${{ inputs.severity }}

on:
  workflow_dispatch:
    inputs:
      type:
        description: "Scan type: sca=Open Source, code=SAST, container=Container image"
        type: choice
        options:
          - sca
          - code
          - container
        default: sca
      target:
        description: "git repo slug owner/repo (for sca/code) OR image ref like alpine:3.19 (for container)"
        type: string
        required: true
      ref:
        description: "Optional git ref/branch for target repo checkout (sca/code only)"
        type: string
        default: ""
      severity:
        description: "Minimum severity threshold to report"
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: low
      all_projects:
        description: "SCA scope: scan all sub-projects/manifests (--all-projects). Off = root manifest only."
        type: boolean
        default: true
      java_version:
        description: "JDK for SCA on JVM projects. Must match the target's build (e.g. ai-dial-core = 21), else Gradle resolves a different dependency graph."
        type: string
        default: "21"
      snyk_token:
        description: "OPTIONAL Snyk API token. If set, overrides the SNYK_TOKEN secret for this run (use for a one-off / different account). Leave empty to use the repo secret. The value is masked in logs and never printed."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Token source: the optional `snyk_token` dispatch input wins when non-empty,
    # otherwise fall back to the repo secret. Exposed only as an env var (never
    # inlined into a `run:` command), so it is not expanded into any step's log.
    env:
      SNYK_TOKEN: ${{ inputs.snyk_token != '' && inputs.snyk_token || secrets.SNYK_TOKEN }}

    steps:
      # Mask the token in logs and fail early if it is not set — free Snyk still
      # requires authentication. The value is referenced only via $SNYK_TOKEN and
      # is never echoed; `::add-mask::` makes GitHub redact it anywhere it leaks.
      - name: Mask and check SNYK_TOKEN
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "::add-mask::$SNYK_TOKEN"
          fi
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::No Snyk token available. Set the SNYK_TOKEN secret (gh secret set SNYK_TOKEN -R <owner/repo>) or pass the optional snyk_token input."
            exit 1
          fi

      # Checkout the TARGET repo (only for sca / code — target must be owner/repo slug).
      # lfs: true — some projects (e.g. ai-dial-core) store the Gradle wrapper jar in
      # Git LFS; without this the runner gets an LFS pointer instead of the real jar and
      # Snyk's Gradle analysis fails with ClassNotFoundException: GradleWrapperMain.
      - name: Checkout target repo
        if: inputs.type != 'container'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target }}
          ref: ${{ inputs.ref }}
          path: target
          lfs: true

      # JDK for SCA on JVM projects: Snyk resolves Gradle/Maven deps by invoking
      # the project's build tool, which needs a JDK on the runner. Without it the
      # Gradle wrapper fails with "Could not find or load main class
      # GradleWrapperMain". Harmless for non-JVM targets, so gated on sca only.
      - name: Setup JDK
        if: inputs.type == 'sca'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      # Install Snyk CLI (puts `snyk` on PATH, no Docker required)
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # --- SCA (Snyk Open Source) ---
      # continue-on-error: a found vuln (exit 1) must not fail the artifact upload.
      - name: Snyk SCA scan
        if: inputs.type == 'sca'
        continue-on-error: true
        working-directory: target
        run: |
          snyk test \
            ${{ inputs.all_projects && '--all-projects' || '' }} \
            --json-file-output=$GITHUB_WORKSPACE/snyk.json \
            --sarif-file-output=$GITHUB_WORKSPACE/snyk.sarif \
            --severity-threshold=${{ inputs.severity }}

      # --- SAST (Snyk Code) --- requires Snyk Code enabled in the org settings
      - name: Snyk Code scan
        if: inputs.type == 'code'
        continue-on-error: true
        working-directory: target
        run: |
          snyk code test \
            --sarif-file-output=$GITHUB_WORKSPACE/snyk.sarif \
            --severity-threshold=${{ inputs.severity }}

      # --- Container scan (no checkout; Snyk pulls the image itself) ---
      - name: Snyk Container scan
        if: inputs.type == 'container'
        continue-on-error: true
        run: |
          snyk container test ${{ inputs.target }} \
            --json-file-output=$GITHUB_WORKSPACE/snyk.json \
            --sarif-file-output=$GITHUB_WORKSPACE/snyk.sarif \
            --severity-threshold=${{ inputs.severity }}

      # HTML report from snyk.json via the official snyk-to-html (sca/container only;
      # Snyk's own --html-file-output is a preview feature, unavailable on free).
      - name: HTML report
        if: always() && hashFiles('snyk.json') != ''
        run: npx -y snyk-to-html -i "$GITHUB_WORKSPACE/snyk.json" -o "$GITHUB_WORKSPACE/snyk.html"

      # Machine-readable results archive (snyk.json + snyk.sarif). No code-scanning
      # upload: this stand scans arbitrary targets, so their findings do not belong
      # in this repo's Security tab. Download the artifact to inspect results.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results-${{ inputs.type }}
          path: |
            snyk.sarif
            snyk.json
          if-no-files-found: ignore

      # Human-readable HTML report as its OWN artifact (separate from the archive
      # above) so it can be downloaded and opened directly without unpacking the
      # json/sarif bundle. Generated for sca/container (code produces no snyk.json).
      - name: Upload HTML report artifact
        if: always() && hashFiles('snyk.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-html
          path: snyk.html
          if-no-files-found: ignore
